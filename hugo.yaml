    title: "gbo" # optional default will be site title
    subtitle: "Software Engineer"
    imageUrl: "/profile-picture.jpg"
    imageTitle: "Profile picture alt"
    imageWidth: 120
    imageHeight: 120
    buttons:
      # - name: Search
      #   url: "/search"
      - name: About
        url: "/about"
      - name: Posts
        url: "/posts"
      # - name: Tags
