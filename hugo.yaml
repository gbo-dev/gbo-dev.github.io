baseURL: temp
languageCode: en-us
title: gbo
theme: PaperMod

params:
  # author: ["gbo"]
  defaultTheme: dark
  disableThemeToggle: true

  hideFooter: true

  ShowBreadCrumbs: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowCodeCopyButtons: true
  disableScrollBarTheme: false

  profileMode:
