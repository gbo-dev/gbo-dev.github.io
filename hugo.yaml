      # - name: Categories
      #   url: "/categories"
      # - name: Agenda
      #   url: "/agenda"

  socialIcons: # optional
    - name: "bluesky"
      url: "https://bsky.app/profile/gastuf.bsky.social"
    - name: "github"
      url: "https://github.com/gbo-dev"
    - name: "unsplash"
      url: "https://unsplash.com/@gbo_"

  cover:
    linkFullImages: true

