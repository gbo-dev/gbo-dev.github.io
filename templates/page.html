{% extends "base.html" %}
{% block title %}{{ page.title }} - {{ config.title }}{% endblock title %}
{% block extra_head %}
  <link rel="stylesheet" href="/css/post.css">
{% endblock extra_head %}
{% block content %}
<article>
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>
  <div class="post-body">
    {{ page.content | safe }}
  </div>
</article>
{% endblock content %}
